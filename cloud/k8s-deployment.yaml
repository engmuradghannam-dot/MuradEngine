# ============================================================
# MuradEngine Kubernetes Deployment
# 1,000,000 Workers in Parallel
# ============================================================
# Apply: kubectl apply -f cloud/k8s-deployment.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: muradengine

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: muradengine
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: muradengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            limits:
              memory: "2Gi"
              cpu: "1000m"

---
# Master Service
apiVersion: v1
kind: Service
metadata:
  name: master
  namespace: muradengine
spec:
  selector:
    app: master
  ports:
    - port: 8080
      targetPort: 8080
  type: LoadBalancer

---
# Master Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: master
  namespace: muradengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: master
  template:
    metadata:
      labels:
        app: master
    spec:
      containers:
        - name: master
          image: muradengine/master:latest
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: TOTAL_WORKERS
              value: "1000000"
          resources:
            limits:
              memory: "4Gi"
              cpu: "2000m"

---
# Worker Deployment - Scale to 1,000,000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: muradengine
spec:
  replicas: 1000  # Scale: kubectl scale deployment worker --replicas=1000000
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: muradengine/worker:latest
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            limits:
              memory: "256Mi"
              cpu: "100m"
            requests:
              memory: "128Mi"
              cpu: "50m"
      # Auto-scaling
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - worker
                topologyKey: kubernetes.io/hostname

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: muradengine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 100
  maxReplicas: 1000000
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: muradengine-ingress
  namespace: muradengine
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: muradengine.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: master
                port:
                  number: 8080
