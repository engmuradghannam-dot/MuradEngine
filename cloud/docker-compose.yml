version: '3.8'

# ============================================================
# MuradEngine Cluster - 1,000,000 Workers Simulation
# ============================================================
# This creates a scalable cluster that can run on:
# - Your local machine
# - Multiple VMs
# - Cloud instances (AWS, GCP, Azure)
#
# Scale: docker-compose up --scale worker=1000

services:
  # Redis - Central task queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    networks:
      - muradengine

  # Master Node - Task distribution
  master:
    build:
      context: ..
      dockerfile: cloud/Dockerfile.master
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379
      - TOTAL_WORKERS=1000000
      - NODE_TYPE=master
    depends_on:
      - redis
    networks:
      - muradengine
    command: python cloud/master_controller.py master

  # Worker Node - Processes tasks (scale to 1M)
  worker:
    build:
      context: ..
      dockerfile: cloud/Dockerfile.worker
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_TYPE=worker
    depends_on:
      - redis
      - master
    networks:
      - muradengine
    deploy:
      replicas: 100  # Scale to 1000, 10000, or 1000000
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    command: python cloud/master_controller.py worker 8000 worker-${HOSTNAME}

  # Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - master
    networks:
      - muradengine

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - muradengine

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - muradengine

volumes:
  redis_data:

networks:
  muradengine:
    driver: bridge
