name: BTC Cross-Matrix Puzzle Scanner

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'

  # Manual trigger
  workflow_dispatch:
    inputs:
      workers:
        description: 'Number of workers'
        required: false
        default: '7'
      step_limit:
        description: 'Step limit (±)'
        required: false
        default: '1000'

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install coincurve requests python-dotenv

    - name: Run Scanner
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python btc_cross_matrix_scanner_v20_secure.py

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scanner-results
        path: |
          scanner_v20_matches.txt
          scanner_v20_wif_keys.txt
          scanner_v20_checkpoint.json
        retention-days: 30
